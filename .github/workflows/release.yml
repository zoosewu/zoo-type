name: release

# 推送 v* 標籤：建置各平台、上傳 release-* artifact，發布交給 zoo-release（docs/RELEASE.md）
# 版本以 tag 為準：建置前把 tag 的版號寫進 Cargo.toml
#
# 更新檔（過渡期兩種都發）：
# - 不含版號的檔名：zoo-release 用共用金鑰簽章、寫進 latest.json（0.1.11 起的版本讀這個）
# - 含版號的檔名＋舊格式 .sig（ZOO_TYPE_SIGNING_KEY）：給已安裝的 0.1.x 自動更新，過幾版後移除
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: tag 的版號
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag $RELEASE_TAG 的格式需為 v主.次.修補"; exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: 版號以 tag 為準
        run: |
          python3 scripts/set-version.py "$VERSION"
          cargo update --workspace
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/macos'
      - name: 詞庫快取
        id: dict
        uses: actions/cache@v4
        with:
          path: assets/dict
          key: dict-${{ hashFiles('scripts/fetch-dict.sh') }}
      - name: 下載詞庫
        if: steps.dict.outputs.cache-hit != 'true'
        run: sh scripts/fetch-dict.sh

      # 模型換新時下載腳本不變，不能只靠快取
      - name: 智慧選字模型（最新正式版附的）
        run: sh scripts/fetch-model.sh
      - name: 匯入 Apple 發布憑證（已配置時）
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_BASE64: ${{ secrets.MACOS_NOTARY_KEY_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: sh scripts/import-macos-signing.sh
      - name: 檢查、測試與 Release 建置
        run: sh scripts/build-macos.sh --check
      - name: 打包與 SHA256
        run: sh scripts/package-macos.sh
      # 0.1.x 的自動更新讀含版號的檔名與舊格式簽章；新版讀 latest.json（不含版號的檔名，zoo-release 簽章）
      - name: 更新檔
        env:
          ZOO_TYPE_SIGNING_KEY: ${{ secrets.ZOO_TYPE_SIGNING_KEY }}
          ARCH: ${{ matrix.arch }}
        run: |
          cargo run -p zct-update --bin zct-release --release --locked --target-dir target/macos -- sign "target/installer/zoo-type-$VERSION-macos-$ARCH.zip" "$VERSION"
          cp "target/installer/zoo-type-$VERSION-macos-$ARCH.zip" "target/installer/zoo-type-macos-$ARCH.zip"
      - name: 設定視窗、候選窗與選單圖示驗證
        run: '"target/macos/動物園輸入法.app/Contents/MacOS/zoo-type" --ui-self-test target/macos/ui-preview'
      - name: 保存 UI 預覽
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-${{ matrix.arch }}
          path: target/macos/ui-preview/*.png
          if-no-files-found: error
      - name: 保存 macOS 發布檔案
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            target/installer/*-macos-${{ matrix.arch }}.zip
            target/installer/*-macos-${{ matrix.arch }}.zip.sig
            target/installer/*-macos-${{ matrix.arch }}-tools.tar.gz
          if-no-files-found: error

      - name: 清理 Apple 憑證
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN_PATH:-}" ]; then security delete-keychain "$MACOS_KEYCHAIN_PATH"; fi
          if [ -n "${MACOS_NOTARY_KEY:-}" ]; then rm -f "$MACOS_NOTARY_KEY"; fi
          rm -f "$RUNNER_TEMP/zoo-type-signing.p12"

  windows:
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: 版號以 tag 為準
        run: |
          python scripts/set-version.py $env:VERSION
          cargo update --workspace

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 詞庫快取
        id: dict
        uses: actions/cache@v4
        with:
          path: assets/dict
          key: dict-${{ hashFiles('scripts/fetch-dict.sh') }}

      - name: 下載詞庫
        if: steps.dict.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-dict.sh

      # 模型換新時下載腳本不變，不能只靠快取
      - name: 智慧選字模型（最新正式版附的）
        shell: bash
        run: bash scripts/fetch-model.sh

      - name: 測試
        run: cargo test --workspace --locked

      - name: Release 建置
        run: cargo build --workspace --release --locked

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: 安裝檔
        shell: pwsh
        run: ./scripts/build-installer.ps1

      # 0.1.x 的自動更新讀含版號的檔名與舊格式簽章；新版讀 latest.json（不含版號的檔名，zoo-release 簽章）
      - name: 更新檔
        shell: pwsh
        env:
          ZOO_TYPE_SIGNING_KEY: ${{ secrets.ZOO_TYPE_SIGNING_KEY }}
        run: |
          cargo run -p zct-update --bin zct-release --release --locked -- sign "target/installer/zoo-type-$env:VERSION-windows-x64-setup.exe" $env:VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "target/installer/zoo-type-$env:VERSION-windows-x64-setup.exe" "target/installer/zoo-type-windows-x64-setup.exe"

      # 這次打包的模型附到新版 Release 上，下一版建置時從這裡取得（sha256 由 zoo-release 產生）
      - name: 智慧選字模型
        shell: bash
        run: cp assets/dict/ngram.bin target/installer/

      - name: 保存 Windows 發布檔案
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            target/installer/*.exe
            target/installer/*.exe.sig
            target/installer/ngram.bin
          if-no-files-found: error

  release:
    needs: [windows, macos]
    permissions:
      contents: write
    uses: zoosewu/zoo-release/.github/workflows/release.yml@v1
    with:
      name: 動物園輸入法
      platforms: '{"windows-x86_64": "zoo-type-windows-x64-setup.exe", "darwin-aarch64": "zoo-type-macos-arm64.zip", "darwin-x86_64": "zoo-type-macos-x64.zip"}'
    secrets: inherit
