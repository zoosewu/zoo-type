name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # 詞庫不在 repo 裡（測試與評測要用）；下載腳本沒改就沿用快取
      - name: 詞庫快取
        id: dict
        uses: actions/cache@v4
        with:
          path: assets/dict
          key: dict-${{ hashFiles('scripts/fetch-dict.sh') }}

      - name: 下載詞庫
        if: steps.dict.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/fetch-dict.sh

      - name: 格式檢查
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy（開發版）
        run: cargo clippy --workspace --all-targets --locked --features zct-tsf/dev,zct-service/dev,zct-settings/dev --target-dir target/dev -- -D warnings

      - name: 測試
        run: cargo test --workspace --locked

      - name: Release 建置
        run: cargo build --workspace --release --locked
