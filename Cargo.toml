[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
chewing = "=0.14.0-alpha.4"
windows = "0.62.2"
windows-core = "0.62"
serde = { version = "1.0.229", features = ["derive"] }
postcard = { version = "1.1.3", features = ["use-std"] }
log = "0.4"
zct-core = { path = "crates/zct-core" }
zct-ipc = { path = "crates/zct-ipc" }

[profile.release]
lto = "thin"
codegen-units = 1
