[package]
name = "zct-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Windows 服務程序與 macOS 共用的主機層：session 生命週期、設定熱載入、AI、提示文字"

[features]
dev = ["zct-core/dev"]

[dependencies]
zct-core.workspace = true
zct-preferences.workspace = true
zct-ai = { path = "../zct-ai" }
zct-update = { path = "../zct-update" }
log.workspace = true
serde.workspace = true
serde_json = "1.0.154"
ureq = "3"
zoo-update = { git = "https://github.com/zoosewu/zoo-release", tag = "v1.0.0" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3.27.0"
