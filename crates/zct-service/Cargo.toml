[package]
name = "zct-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 產出 zoo-type-service.exe（安裝後使用者看得到的檔名）
[[bin]]
name = "zoo-type-service"
path = "src/main.rs"

[features]
# 開發版（見 zct-core/src/channel.rs）：圖示與檔案描述也標成開發版
dev = ["zct-core/dev"]

[dependencies]
zct-core.workspace = true
zct-ipc.workspace = true
zct-ai = { path = "../zct-ai" }
log.workspace = true

[target.'cfg(windows)'.dependencies]
windows-numerics = "0.3.1"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
