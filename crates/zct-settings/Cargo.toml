[package]
name = "zct-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 產出 zoo-type-settings.exe（安裝後使用者看得到的檔名）
[[bin]]
name = "zoo-type-settings"
path = "src/main.rs"

[features]
# 開發版（見 zct-core/src/channel.rs）：圖示與檔案描述也標成開發版
dev = ["zct-core/dev"]

[dependencies]
slint = "1.18.1"
zct-core.workspace = true
zct-ipc.workspace = true
zct-ai = { path = "../zct-ai" }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "3"
slint-build = "1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
