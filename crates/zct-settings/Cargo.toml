[package]
name = "zct-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 產出 zoo-type-settings.exe（安裝後使用者看得到的檔名）
[[bin]]
name = "zoo-type-settings"
path = "src/main.rs"

[dependencies]
slint = "1.18.1"
zct-core.workspace = true
zct-ipc.workspace = true
zct-ai = { path = "../zct-ai" }

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"]

[build-dependencies]
embed-resource = "3"
slint-build = "1.18.1"
